name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: signs_of_life
          POSTGRES_PASSWORD: signs_of_life
          POSTGRES_DB: signs_of_life_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signs_of_life"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://signs_of_life:signs_of_life@localhost:5432/signs_of_life_test
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm exec wrangler deploy --dry-run --config apps/api/wrangler.jsonc
      - run: pnpm exec wrangler deploy --dry-run --config apps/jobs/wrangler.jsonc
      - run: pnpm exec wrangler deploy --dry-run --config apps/web/wrangler.jsonc
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            artifacts/
  containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - run: node scripts/ci-container-env.mjs
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Verify container readiness and static routing
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/api/ready
          curl --fail http://localhost:8080/connections | grep 'Signs of Life'
          docker compose ps
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop the isolated stack
        if: always()
        run: docker compose down --volumes
